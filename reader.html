<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高性价比人生指南 · 电子书</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "SimSun", serif;
    background: #2c2c2c;
    overflow: hidden;
    height: 100vh;
    color: #333;
  }

  /* ========== 开场书本动画 ========== */
  #intro {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, #1e3a2f 0%, #0f1f18 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    transition: opacity 0.6s ease;
  }

  #intro.fade-out {
    opacity: 0;
    pointer-events: none;
  }

  .book-cover {
    width: 460px;
    height: 620px;
    position: relative;
    perspective: 2000px;
    cursor: pointer;
  }

  .book-cover .cover-front {
    position: absolute;
    inset: 0;
    background: linear-gradient(160deg, #f5f0e1 0%, #e8dfc0 100%);
    border-radius: 0 10px 10px 0;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6), inset -2px 0 10px rgba(0,0,0,0.1);
    transform-origin: left center;
    transition: transform 1.4s cubic-bezier(0.35, 0.1, 0.25, 1);
    backface-visibility: hidden;
    overflow: hidden;
  }

  .book-cover.open .cover-front {
    transform: rotateY(-165deg);
  }

  /* 封面插图区域 */
  .cover-illustration {
    position: absolute;
    top: 60px;
    left: 50%;
    transform: translateX(-50%);
    width: 280px;
    height: 200px;
  }

  .cover-content {
    position: absolute;
    top: 290px;
    left: 0;
    right: 0;
    padding: 0 50px;
    text-align: center;
  }

  .cover-title {
    font-size: 38px;
    font-weight: 700;
    color: #1e4029;
    letter-spacing: 6px;
    line-height: 1.3;
    margin-bottom: 16px;
  }

  .cover-divider {
    width: 50px;
    height: 2px;
    background: #c9a96e;
    margin: 0 auto 20px;
  }

  .cover-subtitle {
    font-size: 14px;
    color: #5a6b5a;
    line-height: 1.9;
    letter-spacing: 1px;
  }

  .cover-footer {
    position: absolute;
    bottom: 40px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 12px;
    color: #8a9a8a;
    letter-spacing: 2px;
  }

  .cover-hint {
    position: absolute;
    bottom: 15px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 12px;
    color: #c9a96e;
    animation: pulse 2.5s infinite;
    letter-spacing: 3px;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  /* 书脊阴影 */
  .book-cover::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 15px;
    background: linear-gradient(to right, #152d1d, #2d5a3d);
    border-radius: 6px 0 0 6px;
    z-index: 10;
    box-shadow: 2px 0 10px rgba(0,0,0,0.3);
  }

  /* 书页边缘 */
  .book-cover::after {
    content: '';
    position: absolute;
    right: -3px;
    top: 5px;
    bottom: 5px;
    width: 6px;
    background: repeating-linear-gradient(
      to right,
      #f0e9d0 0px,
      #e8dfc0 1px,
      #f0e9d0 2px,
      #ddd0a8 3px
    );
    border-radius: 0 3px 3px 0;
    z-index: 1;
  }

  /* ========== 阅读器主界面 ========== */
  #reader {
    display: flex;
    flex-direction: column;
    height: 100vh;
    opacity: 0;
    transition: opacity 0.5s ease 0.3s;
    pointer-events: none;
  }

  #reader.active {
    opacity: 1;
    pointer-events: auto;
  }

  /* 顶部工具栏 */
  .toolbar {
    height: 50px;
    background: #1e4029;
    color: #f5f0e1;
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 12px;
    flex-shrink: 0;
  }

  .toolbar button {
    background: none;
    border: 1px solid rgba(245, 240, 225, 0.3);
    color: #f5f0e1;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
  }

  .toolbar button:hover {
    background: rgba(245, 240, 225, 0.15);
  }

  .toolbar .book-title {
    flex: 1;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 1px;
  }

  /* 主体区域 */
  .main-area {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* 侧边目录 */
  .sidebar {
    width: 260px;
    background: #f5f0e1;
    border-right: 1px solid #d4c9a8;
    overflow-y: auto;
    flex-shrink: 0;
    transition: margin-left 0.3s ease;
  }

  .sidebar.collapsed {
    margin-left: -260px;
  }

  .sidebar h3 {
    padding: 16px 20px;
    font-size: 13px;
    color: #1e4029;
    border-bottom: 1px solid #d4c9a8;
    letter-spacing: 2px;
  }

  .sidebar ul {
    list-style: none;
    padding: 8px 0;
  }

  .sidebar li {
    padding: 9px 20px;
    font-size: 13px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: all 0.15s;
    line-height: 1.5;
  }

  .sidebar li:hover {
    background: #ebe4cc;
  }

  .sidebar li.active {
    background: #e8dfc0;
    border-left-color: #2d5a3d;
    color: #1e4029;
    font-weight: 600;
  }

  /* 书本显示区 */
  .book-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%);
    position: relative;
    padding: 30px;
  }

  .book-container {
    width: 100%;
    max-width: 880px;
    height: 100%;
    max-height: 680px;
    display: flex;
    background: #fdfbf5;
    box-shadow: 0 25px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(0,0,0,0.1);
    border-radius: 3px;
    overflow: hidden;
    position: relative;
  }

  .page {
    flex: 1;
    padding: 45px 40px;
    overflow-y: auto;
    line-height: 1.9;
    font-size: 16px;
    transition: font-size 0.2s;
  }

  .page.left-page {
    border-right: 1px solid #e0d8c0;
    background: linear-gradient(to right, #f0e9d0 0%, #fdfbf5 8%);
  }

  .page.right-page {
    background: linear-gradient(to left, #f0e9d0 0%, #fdfbf5 8%);
  }

  /* 书脊阴影 */
  .book-container::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 25px;
    transform: translateX(-50%);
    background: linear-gradient(to right, transparent, rgba(0,0,0,0.1), transparent);
    pointer-events: none;
    z-index: 5;
  }

  /* Markdown 内容样式 */
  .page h1 {
    font-size: 26px;
    color: #1e4029;
    margin-bottom: 24px;
    padding-bottom: 14px;
    border-bottom: 2px solid #c9a96e;
    letter-spacing: 2px;
  }

  .page h2 {
    font-size: 20px;
    color: #2d5a3d;
    margin: 24px 0 12px;
  }

  .page h3 {
    font-size: 17px;
    color: #333;
    margin: 22px 0 10px;
    font-weight: 600;
  }

  .page p {
    margin-bottom: 12px;
    text-indent: 2em;
  }

  .page ul {
    margin: 10px 0 15px 20px;
  }

  .page li {
    margin-bottom: 6px;
  }

  .page a {
    color: #2d5a3d;
    text-decoration: none;
    border-bottom: 1px dotted #2d5a3d;
  }

  .page .meta-line {
    font-size: 14px;
    color: #555;
    margin-bottom: 6px;
    padding: 4px 12px;
    border-left: 3px solid #c9a96e;
    background: rgba(201, 169, 110, 0.05);
  }

  .page .evidence-A { color: #1e6b3a; font-weight: 600; }
  .page .evidence-B { color: #8b6914; font-weight: 600; }
  .page .evidence-C { color: #666; font-weight: 600; }

  /* 翻页按钮 */
  .page-nav {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    align-items: center;
    background: rgba(30, 64, 41, 0.92);
    backdrop-filter: blur(10px);
    padding: 8px 18px;
    border-radius: 30px;
    z-index: 10;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  .page-nav button {
    background: none;
    border: none;
    color: #f5f0e1;
    font-size: 14px;
    cursor: pointer;
    padding: 4px 12px;
    border-radius: 4px;
    transition: background 0.15s;
  }

  .page-nav button:hover {
    background: rgba(245, 240, 225, 0.2);
  }

  .page-nav .page-info {
    color: #f5f0e1;
    font-size: 12px;
    min-width: 60px;
    text-align: center;
    opacity: 0.9;
  }

  /* 滚动条美化 */
  .page::-webkit-scrollbar {
    width: 5px;
  }
  .page::-webkit-scrollbar-track {
    background: transparent;
  }
  .page::-webkit-scrollbar-thumb {
    background: #c9b98a;
    border-radius: 3px;
  }

  /* 夜间模式 */
  body.night .book-area {
    background: linear-gradient(135deg, #111 0%, #0a0a0a 100%);
  }
  body.night .book-container {
    background: #1e1e1e;
    box-shadow: 0 25px 80px rgba(0,0,0,0.6);
  }
  body.night .page {
    color: #bbb;
    background: #1e1e1e !important;
  }
  body.night .page h1,
  body.night .page h2,
  body.night .page h3 {
    color: #8fbc8f;
  }
  body.night .page .meta-line {
    color: #999;
    border-left-color: #c9a96e;
    background: rgba(201, 169, 110, 0.05);
  }
  body.night .page .evidence-A { color: #4caf50; }

  /* 响应式 */
  @media (max-width: 768px) {
    .book-cover { width: 320px; height: 440px; }
    .cover-title { font-size: 26px; letter-spacing: 4px; }
    .cover-illustration { width: 200px; height: 140px; top: 50px; }
    .cover-content { top: 210px; padding: 0 30px; }
    .sidebar { width: 220px; }
    .page { padding: 30px 20px; font-size: 15px; }
    .book-container { flex-direction: column; }
    .page.left-page { border-right: none; border-bottom: 1px solid #444; }
  }
</style>
</head>

<script>
  const chapters = [
    { file: 'book/01-不要早死.md', title: '1. 不要早死' },
    { file: 'book/02-不要慢慢死.md', title: '2. 不要慢慢死' },

    { file: 'book/11-程序员和技术人容易踩的红线.md', title: '11. 技术人红线' },

  ];

  let currentChapter = 0;
  let currentPage = 0;
  let chapterContent = [];
  let fontSize = 16;
  let chapterCache = {}; // 预加载缓存

  // 渲染目录
  function renderChapterList() {
    const list = document.getElementById('chapterList');
    list.innerHTML = '';
    chapters.forEach((ch, i) => {
      const li = document.createElement('li');
      li.textContent = ch.title;
      li.dataset.index = i;
      if (i === currentChapter) li.classList.add('active');
      li.addEventListener('click', () => loadChapter(i));
      list.appendChild(li);
    });
  }

  // 简单 Markdown 转 HTML
  function mdToHtml(md) {
    let html = md;
    html = html.replace(/^\[← 回总目录\]\([^)]*\)\n*/, '');
    html = html.replace(/^# (.*)$/gm, '<h1>$1</h1>');
    html = html.replace(/^## (.*)$/gm, '<h2>$1</h2>');
    html = html.replace(/^### (.*)$/gm, '<h3>$1</h3>');
    html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/\[([^\]]*)\]\(([^)]*)\)/g, '<a href="$2" target="_blank">$1</a>');
    html = html.replace(/<!--.*?-->/g, '');
    html = html.replace(/证据等级：A/g, '<span class="evidence-A">证据等级：A</span>');
    html = html.replace(/证据等级：B/g, '<span class="evidence-B">证据等级：B</span>');
    html = html.replace(/证据等级：C/g, '<span class="evidence-C">证据等级：C</span>');
    html = html.replace(/^- (.*)$/gm, '<div class="meta-line">$1</div>');
    html = html.split(/\n\n+/).map(block => {
      if (block.startsWith('<h') || block.startsWith('<div') || block.startsWith('<ul')) return block;
      return '<p>' + block.replace(/\n/g, '<br>') + '</p>';
    }).join('\n');
    return html;
  }

  // 按 h3 条目拆分页面
  function splitIntoPages(fullHtml) {
    const pages = [];
    const parts = fullHtml.split(/(?=<h3)/);
    let currentChunk = '';
    parts.forEach(part => {
      if (currentChunk.length + part.length > 1400 && currentChunk !== '') {
        pages.push(currentChunk);
        currentChunk = part;
      } else {
        currentChunk += part;
      }
    });
    if (currentChunk) pages.push(currentChunk);
    return pages.length > 0 ? pages : ['<p>内容加载中...</p>'];
  }

  // 加载章节（带缓存）
  async function loadChapter(index) {
    currentChapter = index;
    currentPage = 0;

    document.querySelectorAll('#chapterList li').forEach((li, i) => {
      li.classList.toggle('active', i === index);
    });

    // 先显示缓存的内容
    if (chapterCache[index]) {
      chapterContent = chapterCache[index];
      renderPages();
    } else {
      document.getElementById('leftPage').innerHTML = '<p style="text-align:center;color:#888;margin-top:100px;">加载中...</p>';
      document.getElementById('rightPage').innerHTML = '';
    }

    try {
      const resp = await fetch(chapters[index].file);
      const md = await resp.text();
      const html = mdToHtml(md);
      chapterContent = splitIntoPages(html);
      chapterCache[index] = chapterContent; // 存入缓存
      renderPages();
    } catch (e) {
      document.getElementById('leftPage').innerHTML = '<p>内容加载失败</p>';
    }
  }

  // 渲染当前页
  function renderPages() {
    const left = document.getElementById('leftPage');
    const right = document.getElementById('rightPage');

    if (currentPage === 0) {
      left.innerHTML = '<h1>' + chapters[currentChapter].title + '</h1>' +
        '<p style="margin-top:60px;color:#999;font-size:14px;text-indent:0;text-align:center;">— 点击右侧或下一页开始阅读 —</p>';
    } else {
      left.innerHTML = chapterContent[currentPage * 2] || '';
    }

    right.innerHTML = chapterContent[currentPage * 2 + 1] || (currentPage === 0 ? chapterContent[0] : '');

    const totalPages = Math.ceil(chapterContent.length / 2);
    document.getElementById('pageInfo').textContent = (currentPage + 1) + ' / ' + totalPages;

    left.scrollTop = 0;
    right.scrollTop = 0;
  }

  function nextPage() {
    const totalPages = Math.ceil(chapterContent.length / 2);
    if (currentPage < totalPages - 1) {
      currentPage++;
      renderPages();
    } else if (currentChapter < chapters.length - 1) {
      loadChapter(currentChapter + 1);
    }
  }

  function prevPage() {
    if (currentPage > 0) {
      currentPage--;
      renderPages();
    } else if (currentChapter > 0) {
      loadChapter(currentChapter - 1);
      const totalPages = Math.ceil(chapterContent.length / 2);
      currentPage = totalPages - 1;
      renderPages();
    }
  }

  // 预加载第一章（页面加载后立即后台加载，消除翻开卡顿）
  async function preloadFirstChapter() {
    try {
      const resp = await fetch(chapters[0].file);
      const md = await resp.text();
      const html = mdToHtml(md);
      chapterContent = splitIntoPages(html);
      chapterCache[0] = chapterContent;
    } catch (e) {
      // 静默失败，翻开后再加载
    }
  }

  // 事件绑定
  document.getElementById('bookCover').addEventListener('click', () => {
    document.getElementById('bookCover').classList.add('open');
    setTimeout(() => {
      document.getElementById('intro').classList.add('fade-out');
      document.getElementById('reader').classList.add('active');
      // 内容已经预加载好了，直接渲染
      renderChapterList();
      renderPages();
    }, 1000);
  });

  document.getElementById('toggleSidebar').addEventListener('click', () => {
    document.getElementById('sidebar').classList.toggle('collapsed');
  });

  document.getElementById('toggleNight').addEventListener('click', () => {
    document.body.classList.toggle('night');
  });

  document.getElementById('fontSizeA+').addEventListener('click', () => {
    fontSize = Math.min(fontSize + 1, 22);
    document.querySelectorAll('.page').forEach(p => p.style.fontSize = fontSize + 'px');
  });

  document.getElementById('fontSizeA-').addEventListener('click', () => {
    fontSize = Math.max(fontSize - 1, 13);
    document.querySelectorAll('.page').forEach(p => p.style.fontSize = fontSize + 'px');
  });

  document.getElementById('nextPage').addEventListener('click', nextPage);
  document.getElementById('prevPage').addEventListener('click', prevPage);

  document.addEventListener('keydown', (e) => {
    if (!document.getElementById('reader').classList.contains('active')) return;
    if (e.key === 'ArrowRight' || e.key === ' ') nextPage();
    if (e.key === 'ArrowLeft') prevPage();
  });

  // 初始化：页面加载完就预加载第一章
  renderChapterList();
  preloadFirstChapter();
</script>

</body>
</html>
